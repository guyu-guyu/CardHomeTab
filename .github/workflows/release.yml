name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"   # 裸版本号，如 0.1.0；GitHub 用 glob 语法，不是正则

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json, manifest.json and versions.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          MAN="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")"
          MANMIN="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).minAppVersion")"
          MIN="$(TAG="$TAG" node -p "JSON.parse(require('fs').readFileSync('versions.json','utf8'))[process.env.TAG] ?? ''")"
          echo "tag=$TAG package.json=$PKG manifest.json=$MAN versions.json[$TAG]=$MIN minAppVersion=$MANMIN"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag '$TAG' 与 package.json 版本 '$PKG' 不一致"; exit 1; }
          [ "$TAG" = "$MAN" ] || { echo "::error::tag '$TAG' 与 manifest.json 版本 '$MAN' 不一致"; exit 1; }
          [ -n "$MIN" ] || { echo "::error::versions.json 缺少 '$TAG' 条目"; exit 1; }
          [ "$MIN" = "$MANMIN" ] || echo "::warning::versions.json['$TAG']='$MIN' 与 manifest.json minAppVersion='$MANMIN' 不同"

      - name: Lint, test, typecheck and build
        run: npm run check

      - name: Verify build output
        run: |
          set -euo pipefail
          for f in main.js manifest.json styles.css; do
            [ -s "dist/$f" ] || { echo "::error::dist/$f 缺失或为空"; exit 1; }
          done
          ls -l dist

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          awk -v pfx="## $TAG" '
            index($0, pfx) == 1 &&
            (length($0) == length(pfx) || substr($0, length(pfx) + 1, 1) ~ /^[ \t]$/) { insection = 1; next }
            insection && index($0, "## ") == 1 { exit }
            insection { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if [ -s release-notes.md ]; then
            echo "使用 CHANGELOG.md 中 $TAG 的条目"
          else
            echo "CHANGELOG.md 无 $TAG 条目，回退为自动生成"
          fi

      # 先建成 draft，不要一步创建成已发布的。`gh release create` 是「先建 release、再逐个上传
      # 资源」，中间有几十秒窗口：release 已经能被查到，资源却还没挂上。0.2.0 实测这个窗口是
      # 09:59:33 → 10:00:03，而 Obsidian 的上架校验正好落在里面，于是报「这个版本缺 main.js /
      # manifest.json」。draft 对外不可见，等资源齐了再翻成已发布，这个窗口就不存在了。
      - name: Create the release as a draft, with its assets
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ -s release-notes.md ]; then
            gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md \
              --verify-tag dist/main.js dist/manifest.json dist/styles.css
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes \
              --verify-tag dist/main.js dist/manifest.json dist/styles.css
          fi

      # --latest 放在这一步而不是 create：make_latest 只对已发布的 release 有意义，
      # 在 draft 上给它不一定生效。
      - name: Publish once every asset is attached
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 翻成已发布之前先核一遍资源。校验不过就让它留在 draft——draft 对外不可见，
          # 比发出一个装不上的版本好；这一步失败时需要手动删掉那个 draft 再重跑。
          NAMES="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "attached: $NAMES"
          # 用 here-string 而不是 `printf ... | grep -q`：`grep -q` 命中后会立刻退出，写端可能
          # 拿到 SIGPIPE 变成 141，而 pipefail 会把它当成整条管道失败——资源明明在却判成缺失，
          # 且只在偶发时暴露。
          for f in main.js manifest.json styles.css; do
            grep -qx "$f" <<<"$NAMES" \
              || { echo "::error::release 资源缺少 $f，保持 draft 不发布"; exit 1; }
          done
          gh release edit "$TAG" --draft=false --latest
